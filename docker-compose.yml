services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rate-limiter:
    build: ./rate-limiter-backend
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:8080
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/rate-limiter/rules"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      RATE_LIMITER_URL: http://rate-limiter:4000
      CORS_ORIGIN: http://localhost:8080
    depends_on:
      rate-limiter:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_APP_BACKEND_URL: http://localhost:3001
        VITE_RATE_LIMITER_URL: http://localhost:4000
    ports:
      - "8080:80"
    depends_on:
      - backend
