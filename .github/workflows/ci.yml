name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack
        run: corepack enable

      - name: Install rate-limiter-backend
        working-directory: rate-limiter-backend
        run: pnpm install --frozen-lockfile

      - name: Test rate-limiter-backend
        working-directory: rate-limiter-backend
        run: pnpm test

      - name: Install backend
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Test backend
        working-directory: backend
        run: pnpm test

      - name: Install frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: pnpm build
